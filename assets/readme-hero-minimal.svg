<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Our's Algorithm Records</title>
  <desc id="desc">A minimal README banner for a collaborative algorithm records repository.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#111827"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 210) rotate(90) scale(380 700)">
      <stop stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" stroke="#94a3b8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="420" rx="36" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="36" fill="url(#grid)"/>
  <rect width="1200" height="420" rx="36" fill="url(#glow)"/>
  <rect x="72" y="70" width="1056" height="280" rx="34" fill="#020617" fill-opacity="0.45" stroke="#334155"/>
  <text x="600" y="176" text-anchor="middle" fill="#a5b4fc" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="800" letter-spacing="4">ALGORITHM · FRIENDS · HOT 100</text>
  <text x="600" y="246" text-anchor="middle" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui" font-size="62" font-weight="850" letter-spacing="-1.8">Our's Algorithm Records</text>
  <text x="600" y="296" text-anchor="middle" fill="#cbd5e1" font-family="Inter, ui-sans-serif, system-ui" font-size="22" font-weight="500">Notes · Templates · Progress · Review</text>
</svg>
